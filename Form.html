<!DOCTYPE html>
<html>
<head>
    <title>Premium Registration Form</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* Outer Gradient */
            background: linear-gradient(135deg, #667eea, #764ba2);

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-box {
            /* Soft gradient inside */
            background: linear-gradient(135deg, #ffffff, #eef2ff);

            padding: 30px;
            width: 380px;

            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;

            /* Color accent heading */
            color: #5a67d8;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 10px;

            /* Light input background */
            background: #f8f9ff;

            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;

            transition: 0.3s;
        }

        .input-group label {
            position: absolute;
            top: 12px;
            left: 10px;

            /* Label color accent */
            color: #888;

            font-size: 14px;
            pointer-events: none;
            transition: 0.3s;
            padding: 0 5px;
        }

        /* Floating Effect */
        .input-group input:focus + label,
        .input-group input:valid + label {
            top: -8px;
            left: 8px;
            font-size: 12px;

            /* Active accent color */
            color: #667eea;
            background: #eef2ff;
        }

        /* Focus effect */
        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102,126,234,0.3);
            background: #ffffff;
        }

        /* Button */
        input[type="submit"] {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;

            font-size: 16px;
            cursor: pointer;

            transition: 0.3s;
        }

        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.2);
        }

    </style>
</head>

<body>

    <div class="form-box">
        <h2>Register</h2>

        <form>

            <div class="input-group">
                <input type="text" required>
                <label>Full Name</label>
            </div>

            <div class="input-group">
                <input type="email" required>
                <label>Email</label>
            </div>

            <div class="input-group">
                <input type="tel" required>
                <label>Phone Number</label>
            </div>

            <div class="input-group">
                <input type="password" required>
                <label>Password</label>
            </div>

            <div class="input-group">
                <input type="password" required>
                <label>Confirm Password</label>
            </div>

            <input type="submit" value="Create Account">

        </form>
    </div>

</body>
</html>
